# Full stack: origin, collector, Kafka (KRaft), consumer, dashboard (+ player at /player/).
#   docker compose up -d --build
#   docker compose --profile load run --rm loadgen --rate 20 --duration-s 300 --inject B:300
# Host ports: origin 8080, collector 8081, consumer API 8082, dashboard 8083, Kafka 29092.
# Needs media/hls (scripts/package.sh) and data/traces (scripts/fetch_traces.sh) on the host.
name: avs

# Each image is built by exactly one service (origin, collector, dashboard); the others reuse it.
x-cpp-build: &cpp-build
  build: { context: ., dockerfile: docker/Dockerfile, target: cpp }
  image: avs-cpp:latest
x-node-build: &node-build
  build: { context: ., dockerfile: docker/Dockerfile, target: node }
  image: avs-node:latest

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  origin:
    <<: *cpp-build
    command: ["avs_origin", "--root", "/media", "--trace-dir", "/traces", "--port", "8080"]
    volumes:
      - ./media:/media:ro
      - ./data/traces:/traces:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 10

  collector:
    <<: *node-build
    environment:
      PORT: "8081"
      SINK: kafka
      KAFKA_BROKERS: kafka:9092
      TOPIC: telemetry
      PARTITIONS: "6"
      ARMS: A,B
    ports: ["8081:8081"]
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30

  consumer:
    image: avs-cpp:latest
    command: ["avs_consumer", "--brokers", "kafka:9092", "--topic", "telemetry", "--group", "avs-consumer", "--port", "8082"]
    ports: ["8082:8082"]
    depends_on:
      collector: { condition: service_healthy }
      origin: { condition: service_started }  # ensures avs-cpp is built first
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/healthz"]
      interval: 5s
      retries: 10

  dashboard:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    image: avs-web:latest
    ports: ["8083:8083"]
    depends_on: [consumer]

  loadgen:
    image: avs-node:latest
    profiles: ["load"]
    entrypoint: ["npx", "tsx", "services/loadgen/src/main.ts", "--collector", "http://collector:8081"]
    volumes:
      - ./media/hls/ladder.json:/app/media/hls/ladder.json:ro
      - ./data/traces:/app/data/traces:ro
    depends_on:
      collector: { condition: service_healthy }
